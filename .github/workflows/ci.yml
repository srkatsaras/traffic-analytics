name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend test image
        run: docker build --target test -t traffic-analytics-tests .

      - name: Run Python tests
        run: docker run --rm traffic-analytics-tests

      - name: Build application images
        run: docker compose build api frontend

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 180

      - name: Check frontend
        run: curl --fail --silent --show-error http://localhost:8080/ > /dev/null

      - name: Check API through frontend proxy
        run: curl --fail --silent --show-error http://localhost:8080/api/health

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down
